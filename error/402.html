<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DC Consult - Erreur 402</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #F8F9FA;
            color: #2C2F33;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-content {
            max-width: 800px;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            color: #0055A4;
            position: relative;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .error-code::before {
            content: "€";
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 4rem;
            color: gold;
            animation: coinSpin 3s infinite linear;
        }

        @keyframes coinSpin {
            0% { transform: translateY(-50%) rotateY(0deg); }
            100% { transform: translateY(-50%) rotateY(360deg); }
        }

        .error-title {
            font-size: 2.5rem;
            margin: 1rem 0;
            color: #0055A4;
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: #0055A4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 85, 164, 0.3);
            position: relative;
            overflow: hidden;
        }

        .error-btn:hover {
            background-color: #003366;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 85, 164, 0.4);
        }

        .money-falling {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .money {
            position: absolute;
            color: gold;
            font-size: 1.5rem;
            animation: falling linear infinite;
            opacity: 0.7;
        }

        @keyframes falling {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .error-illustration {
            width: 250px;
            height: 250px;
            margin: 2rem auto;
            position: relative;
        }

        .error-illustration img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            .error-code::before {
                right: -40px;
                font-size: 2.5rem;
            }
            .error-title {
                font-size: 1.8rem;
            }
            .error-message {
                font-size: 1rem;
            }
            .error-illustration {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="logo">
            <img src="../img/logo-blanc.png" alt="DC Consult Logo">
        </a>
    </nav>

    <div class="error-container">
        <div class="money-falling" id="moneyContainer"></div>
        
        <div class="error-content">
            <h1 class="error-code">402</h1>
            <h2 class="error-title">Paiement requis</h2>
            <p class="error-message">
                Oups ! L'accès à cette ressource nécessite un paiement.<br>
                Si vous pensez qu'il s'agit d'une erreur, veuillez contacter notre service client.
            </p>
            
            <a href="/" class="error-btn">
                <i class="fas fa-home"></i> Retour à l'accueil
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('moneyContainer');
            const moneySymbols = ['€', '💰', '💵', '💶', '💷', '💴'];
            
            function createMoney() {
                const money = document.createElement('div');
                money.className = 'money';
                money.textContent = moneySymbols[Math.floor(Math.random() * moneySymbols.length)];
                money.style.left = Math.random() * 100 + 'vw';
                money.style.animationDuration = (Math.random() * 3 + 2) + 's';
                money.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(money);
                
                // Supprimer après l'animation
                setTimeout(() => {
                    money.remove();
                }, 5000);
            }
            
            // Créer des billets qui tombent régulièrement
            setInterval(createMoney, 300);
            
            // Créer initialement plusieurs billets
            for (let i = 0; i < 15; i++) {
                setTimeout(createMoney, i * 200);
            }
        });
    </script>
</body>

</html>
