<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DC Consult - Erreur 403</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2C2F33;
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-content {
            max-width: 800px;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            color: #FF5252;
            position: relative;
        }

        .error-code::before {
            content: "🚫";
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 4rem;
        }

        .error-title {
            font-size: 2.5rem;
            margin: 1rem 0;
            color: white;
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: #FF5252;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255, 82, 82, 0.3);
            position: relative;
            overflow: hidden;
        }

        .error-btn:hover {
            background-color: #FF1744;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 82, 82, 0.4);
        }

        .error-illustration {
            width: 250px;
            height: 250px;
            margin: 2rem auto;
            position: relative;
            animation: shake 0.5s ease-in-out infinite alternate;
        }

        @keyframes shake {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        .error-illustration img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .laser-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.2;
        }

        .laser {
            position: absolute;
            background-color: #FF5252;
            animation: laserScan 4s linear infinite;
        }

        .laser.horizontal {
            height: 1px;
            width: 100%;
        }

        .laser.vertical {
            width: 1px;
            height: 100%;
        }

        @keyframes laserScan {
            0% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(100vh) translateX(0); }
            50% { transform: translateY(100vh) translateX(100vw); }
            75% { transform: translateY(0) translateX(100vw); }
            100% { transform: translateY(0) translateX(0); }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            .error-code::before {
                right: -40px;
                font-size: 2.5rem;
            }
            .error-title {
                font-size: 1.8rem;
            }
            .error-message {
                font-size: 1rem;
            }
            .error-illustration {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">
            <img src="../img/logo-blanc.png" alt="DC Consult Logo">
        </a>
    </nav>

    <div class="error-container">
        <div class="laser-grid" id="laserGrid"></div>
        
        <div class="error-content">
            <h1 class="error-code">403</h1>
            <h2 class="error-title">Accès interdit</h2>
            <p class="error-message">
                Alerte sécurité ! Vous n'avez pas l'autorisation d'accéder à cette zone.<br>
                Toute tentative non autorisée sera enregistrée.
            </p>
            
            <div class="error-illustration">
                <img src="../img/security-403.png" alt="Icône de sécurité">
            </div>
            
            <a href="../index.html" class="error-btn">
                <i class="fas fa-home"></i> Retour à zone sécurisée
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const grid = document.getElementById('laserGrid');
            
            // Créer un quadrillage de lasers
            for (let i = 0; i < 5; i++) {
                const horizontalLaser = document.createElement('div');
                horizontalLaser.className = 'laser horizontal';
                horizontalLaser.style.top = (i * 20) + 'vh';
                horizontalLaser.style.animationDelay = (i * 0.5) + 's';
                grid.appendChild(horizontalLaser);
                
                const verticalLaser = document.createElement('div');
                verticalLaser.className = 'laser vertical';
                verticalLaser.style.left = (i * 20) + 'vw';
                verticalLaser.style.animationDelay = (i * 0.5 + 1) + 's';
                grid.appendChild(verticalLaser);
            }
        });
    </script>
</body>

</html>
