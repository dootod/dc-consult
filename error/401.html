<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DC Consult - Erreur 401</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0055A4 0%, #003366 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .error-content {
            max-width: 800px;
            position: relative;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        .error-code::after {
            content: "🔒";
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%) rotate(0deg);
            font-size: 4rem;
            animation: lockShake 2s infinite;
        }

        @keyframes lockShake {
            0%, 100% { transform: translateY(-50%) rotate(0deg); }
            25% { transform: translateY(-50%) rotate(10deg); }
            75% { transform: translateY(-50%) rotate(-10deg); }
        }

        .error-title {
            font-size: 2.5rem;
            margin: 1rem 0;
            color: white;
        }

        .error-message {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background-color: white;
            color: #0055A4;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .error-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .error-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .error-btn:hover::before {
            left: 100%;
        }

        .error-illustration {
            width: 200px;
            height: 200px;
            margin: 2rem auto;
            position: relative;
        }

        .error-illustration img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            .error-code::after {
                right: -40px;
                font-size: 2.5rem;
            }
            .error-title {
                font-size: 1.8rem;
            }
            .error-message {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">
            <img src="../img/logo-blanc.png" alt="DC Consult Logo">
        </a>
    </nav>

    <div class="error-container">
        <div class="error-content">
            <h1 class="error-code">401</h1>
            <h2 class="error-title">Accès non autorisé</h2>
            <p class="error-message">
                Oups ! Il semble que vous n'ayez pas les autorisations nécessaires pour accéder à cette page.<br>
                Veuillez vous authentifier ou contacter l'administrateur si vous pensez qu'il s'agit d'une erreur.
            </p>
            
            <div class="error-illustration">
                <img src="../img/security-401.png" alt="Icône de verrouillage">
            </div>
            
            <a href="../index.html" class="error-btn">
                <i class="fas fa-home"></i> Retour à l'accueil
            </a>
        </div>
    </div>
</body>

</html>
